<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado Jurídico: La Polis y el Mundo Helénico</title>
    <!-- Enlace al Manifiesto PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <!-- Google Fonts: Inter para un diseño limpio y moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            max-width: 600px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .game-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .stats-bar span strong {
            color: var(--accent-color);
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 10px;
        }

        canvas {
            background: transparent;
        }

        .clue-box {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--accent-color);
            padding: 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: var(--text-primary);
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .word-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .letter-slot {
            font-size: 1.5rem;
            font-weight: 700;
            width: 32px;
            border-bottom: 3px solid var(--accent-color);
            text-align: center;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .key-btn {
            background-color: #334155;
            color: var(--text-primary);
            border: none;
            border-radius: 6px;
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .key-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .key-btn:disabled {
            background-color: #1e293b;
            color: var(--border);
            border: 1px solid var(--border);
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .modal-content p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 480px) {
            .keyboard {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Las Ciudades Estado en Grecia</h1>
        <p>Instituciones Políticas y Jurídicas de la Polis</p>
    </header>

    <div class="game-container">
        <div class="stats-bar">
            <span>Progreso: <strong id="current-word-idx">1</strong> / <strong id="total-words">15</strong></span>
            <span>Errores permitidos: <strong id="lives">6</strong> / 6</span>
        </div>

        <div class="canvas-container">
            <canvas id="hangmanCanvas" width="160" height="130"></canvas>
        </div>

        <div class="clue-box" id="clueText">
            Cargando pista dogmática...
        </div>

        <div class="word-display" id="wordDisplay"></div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Modal de Victoria / Derrota -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 id="modalTitle">Resultado</h2>
            <p id="modalMessage">Mensaje del sistema doctrinal.</p>
            <button class="action-btn" id="modalBtn" onclick="nextStep()">Siguiente Término</button>
        </div>
    </div>

  <script>
    // Banco de palabras rigurosamente ligado al contenido de la cátedra sobre Ciudades-Estado
    const lexicon = [
        { word: "CORINTO", clue: "Polis de gran importancia estratégica y comercial, famosa por su riqueza y sus dos puertos." },
        { word: "TEBAS", clue: "Ciudad clave en la región de Beocia, que llegó a desafiar y derrotar el poder militar de Esparta." },
        { word: "ARGOS", clue: "Una de las ciudades más antiguas del Peloponeso y tradicional rival de Esparta." },
        { word: "MEGARA", clue: "Importante potencia comercial y fundadora de varias colonias." },
        { word: "DELFOS", clue: "Famosa globalmente por albergar el santuario y el oráculo de Apolo, con enorme peso político y religioso." },
        { word: "EGINA", clue: "Isla-estado situada en el golfo Sarónico, reconocida por su poderío naval y rivalidad comercial con Atenas." },
        { word: "SICION", clue: "Una de las polis destacadas dentro del Peloponeso y Grecia Central." },
        { word: "EPIDAURO", clue: "Polis destacada dentro del Peloponeso reconocida por su tradicional santuario y teatro." },
        { word: "MANTINEA", clue: "Importante polis destacada dentro del Peloponeso y escenario de trascendentales conflictos militares." },
        { word: "SIRACUSA", clue: "La colonia y polis griega más grande y poderosa de Sicilia." },
        { word: "MILETO", clue: "Situada en la costa de Jonia, fue un gran centro intelectual, comercial y cuna de los primeros filósofos." },
        { word: "RODAS", clue: "Isla y polis de gran relevancia marítima, comercial y artística." },
        { word: "EFESO", clue: "Importante ciudad de la costa jónica con gran desarrollo cultural y arquitectónico." },
        { word: "HALICARNASO", clue: "Ciudad de la costa jónica célebre por su arquitectura monumental e historia." },
        { word: "TARENTO", clue: "Próspera ciudad-estado fundada por colonos griegos en el sur de la península itálica." },
        { word: "CUMAS", clue: "Antigua colonia griega situada en el sur de Italia, destacada por su cercanía a la Sibila." },
        { word: "AGRIGENTO", clue: "Próspera ciudad-estado fundada por colonos griegos en la isla de Sicilia." }
    ];

    let currentIndex = 0;
    let currentWordObj = {};
    let guessedLetters = new Set();
    let wrongAttempts = 0;
    const maxWrong = 6;
    let gameActive = true;

    // Mezclar aleatoriamente el léxico al iniciar para dinamizar la exposición
    let gameLexicon = [...lexicon].sort(() => Math.random() - 0.5);

    const canvas = document.getElementById("hangmanCanvas");
    const ctx = canvas.getContext("2d");

    function initGame() {
        if (currentIndex >= gameLexicon.length) {
            currentIndex = 0;
            gameLexicon = [...lexicon].sort(() => Math.random() - 0.5);
        }
        currentWordObj = gameLexicon[currentIndex];
        guessedLetters.clear();
        wrongAttempts = 0;
        gameActive = true;

        document.getElementById("current-word-idx").textContent = currentIndex + 1;
        document.getElementById("total-words").textContent = gameLexicon.length;
        document.getElementById("lives").textContent = maxWrong - wrongAttempts;
        document.getElementById("clueText").textContent = `Pista: ${currentWordObj.clue}`;
        document.getElementById("gameModal").style.display = "none";

        renderWord();
        renderKeyboard();
        drawHangman();
    }

    function renderWord() {
        const container = document.getElementById("wordDisplay");
        container.innerHTML = "";
        let solved = true;

        for (let char of currentWordObj.word) {
            const slot = document.createElement("div");
            slot.className = "letter-slot";
            if (guessedLetters.has(char)) {
                slot.textContent = char;
            } else {
                slot.textContent = "";
                solved = false;
            }
            container.appendChild(slot);
        }

        if (solved && gameActive) {
            gameActive = false;
            triggerEndGame(true);
        }
    }

    function renderKeyboard() {
        const container = document.getElementById("keyboard");
        container.innerHTML = "";
        const alphabet = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";

        for (let letter of alphabet) {
            const btn = document.createElement("button");
            btn.className = "key-btn";
            btn.textContent = letter;
            btn.disabled = guessedLetters.has(letter) || !gameActive;
            btn.onclick = () => handleGuess(letter);
            container.appendChild(btn);
        }
    }

    function handleGuess(letter) {
        if (!gameActive || guessedLetters.has(letter)) return;
        guessedLetters.add(letter);

        if (currentWordObj.word.includes(letter)) {
            renderWord();
            renderKeyboard();
        } else {
            wrongAttempts++;
            document.getElementById("lives").textContent = maxWrong - wrongAttempts;
            drawHangman();
            renderKeyboard();

            if (wrongAttempts >= maxWrong) {
                gameActive = false;
                triggerEndGame(false);
            }
        }
    }

    function triggerEndGame(won) {
        const modal = document.getElementById("gameModal");
        const title = document.getElementById("modalTitle");
        const message = document.getElementById("modalMessage");
        const btn = document.getElementById("modalBtn");

        if (won) {
            title.textContent = "¡Concepto Validado!";
            title.style.color = "var(--success)";
            message.textContent = `Has dominado correctamente la polis: "${currentWordObj.word}".`;
            btn.textContent = "Siguiente Término";
        } else {
            title.textContent = "Falla Dogmática";
            title.style.color = "var(--danger)";
            message.textContent = `El término correcto era: "${currentWordObj.word}".`;
            btn.textContent = "Reintentar con otro concepto";
        }
        modal.style.display = "flex";
    }

    function nextStep() {
        currentIndex++;
        initGame();
    }

    // Renderizado gráfico limpio del ahorcado sobre Canvas
    function drawHangman() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";

        // Base de la horca
        ctx.beginPath();
        ctx.moveTo(20, 120);
        ctx.lineTo(100, 120);
        ctx.moveTo(40, 120);
        ctx.lineTo(40, 10);
        ctx.lineTo(100, 10);
        ctx.lineTo(100, 30);
        ctx.stroke();

        // Partes según errores
        if (wrongAttempts >= 1) {
            // Cabeza
            ctx.beginPath();
            ctx.arc(100, 42, 12, 0, Math.PI * 2);
            ctx.stroke();
        }
        if (wrongAttempts >= 2) {
            // Tronco
            ctx.beginPath();
            ctx.moveTo(100, 54);
            ctx.lineTo(100, 90);
            ctx.stroke();
        }
        if (wrongAttempts >= 3) {
            // Brazo izquierdo
            ctx.beginPath();
            ctx.moveTo(100, 62);
            ctx.lineTo(80, 78);
            ctx.stroke();
        }
        if (wrongAttempts >= 4) {
            // Brazo derecho
            ctx.beginPath();
            ctx.moveTo(100, 62);
            ctx.lineTo(120, 78);
            ctx.stroke();
        }
        if (wrongAttempts >= 5) {
            // Pierna izquierda
            ctx.beginPath();
            ctx.moveTo(100, 90);
            ctx.lineTo(85, 112);
            ctx.stroke();
        }
        if (wrongAttempts >= 6) {
            // Pierna derecha
            ctx.beginPath();
            ctx.moveTo(100, 90);
            ctx.lineTo(115, 112);
            ctx.stroke();
        }
    }

    // Inicializar al cargar
    window.onload = initGame;
</script>
</body>
</html>
